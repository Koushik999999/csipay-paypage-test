<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CSIPay Manual Payment</title>

    <link
        rel="stylesheet"
        href="PayPage.css">

    <script
        src="https://staging-pyxisapi.csipay.com/js/v1/csi_pay.js"
        defer>
    </script>

    <script
        src="PayPage.js"
        defer>
    </script>

</head>

<body>

<div class="container">

    <!-- Amount -->

    <div class="amount-card">

        <div class="amount-title">
            Amount to pay
        </div>

        <div
            id="amountValue"
            class="amount-value">
            $0.00
        </div>

    </div>

    <form id="paymentForm">

        <div class="payment-card">

            <!-- CSIPay iframe -->

            <div id="cardElement"></div>

            <!-- Billing Address -->

            <div class="address-grid">

                <div class="field">

                    <label for="street">
                        Street Address
                    </label>

                    <input
                        id="street"
                        type="text"
                        placeholder="123 Main Street"
                        autocomplete="address-line1">

                </div>

                <div class="field">

                    <label for="city">
                        City
                    </label>

                    <input
                        id="city"
                        type="text"
                        placeholder="City"
                        autocomplete="address-level2">

                </div>

                <div class="field">

                    <label for="state">
                        State
                    </label>

                    <input
                        id="state"
                        type="text"
                        placeholder="State"
                        autocomplete="address-level1">

                </div>

                <div class="field">

                    <label for="zip">
                        ZIP Code
                    </label>

                    <input
                        id="zip"
                        type="text"
                        maxlength="5"
                        inputmode="numeric"
                        placeholder="ZIP Code"
                        autocomplete="postal-code">

                </div>

            </div>

            <input
                type="hidden"
                id="paymentId">

            <div
                id="errors"
                class="error-banner hidden">
            </div>

            <button
                id="payButton"
                type="submit">
                Pay
            </button>

        </div>

    </form>

</div>

</body>

</html>

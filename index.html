<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>CSIPay Manual Payment</title>
    <link
        rel="stylesheet"
        href="PayPage.css">
        <script
            src="https://staging-pyxisapi.csipay.com/js/v1/csi_pay.js"
            defer>
        </script>
        <script src="PayPage.js" defer></script>
</head>
<div id="toast" class="toast"></div>
<body>
    <div class="container">
        <form id="paymentForm">
            <div id="cardElement"></div>
            <div class="address-container">
                <input
                    id="address1"
                    type="text"
                    placeholder="Address Line 1"
                    autocomplete="address-line1">
                <input
                    id="address2"
                    type="text"
                    placeholder="Address Line 2"
                    autocomplete="address-line2">
                <input
                    id="city"
                    type="text"
                    placeholder="City"
                    autocomplete="address-level2">
                <input
                    id="state"
                    type="text"
                    placeholder="State"
                    autocomplete="address-level1">
                <input
                    id="zip"
                    type="text"
                    placeholder="ZIP Code"
                    autocomplete="postal-code">
                <input
                    id="country"
                    type="text"
                    placeholder="Country"
                    autocomplete="country-name">
            </div>
            <div
                id="errors"
                class="hidden">
            </div>
            <input
                type="hidden"
                id="paymentId">
                <button id="payButton" type="submit">
                    Pay Now
                </button>
        </form>
    </div>
</body>
</html>

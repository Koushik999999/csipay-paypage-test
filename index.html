<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">
        <title>CSIPay Manual Payment</title>
        <link
            rel="stylesheet"
            href="PayPage.css">
        <script
            src="https://staging-pyxisapi.csipay.com/js/v1/csi_pay.js"
            defer>
        </script>
        <script
            src="LocationData.js"
            defer>
        </script>
        <script
            src="PayPage.js"
            defer>
        </script>
    </head>
<body>
<div class="container">
    <!-- Amount -->
    <div class="amount-card">
        <div class="amount-title">
            Amount to pay
        </div>
        <div
            id="amountValue"
            class="amount-value">
            $0.00
        </div>
    </div>
    <form
        id="paymentForm"
        novalidate>
        <div class="payment-card">
            <!-- CSIPay Hosted Card -->
            <div id="cardElement"></div>
            <!-- Billing Address -->
<div class="address-grid">

    <div class="field full-width">
        <label for="street">
            Address Line 1
        </label>
        <input
            id="street"
            type="text"
            placeholder="Street address"
            autocomplete="address-line1"
            required>
    </div>

    <div class="field full-width">
        <label for="street2">
            Address Line 2
        </label>
        <input
            id="street2"
            type="text"
            placeholder="Apartment, suite, unit (optional)"
            autocomplete="address-line2">
    </div>

    <div class="field">
        <label for="city">
            City
        </label>
        <input
            id="city"
            type="text"
            autocomplete="address-level2"
            required>
    </div>

    <div class="field">
        <label for="state">
            State
        </label>
        <select
            id="state"
            autocomplete="address-level1"
            required>
        </select>
    </div>

    <div class="field">
        <label for="zip">
            ZIP Code
        </label>
        <input
            id="zip"
            type="text"
            maxlength="5"
            inputmode="numeric"
            autocomplete="postal-code"
            required>
    </div>

    <div class="field">
        <label for="country">
            Country
        </label>
        <select
            id="country"
            autocomplete="country"
            required>
        </select>
    </div>

</div>
            <input
                type="hidden"
                id="paymentId">
            <div
                id="errors"
                class="error-banner hidden"
                aria-live="polite">
            </div>
            <button
                id="payButton"
                type="submit">
                Pay Now
            </button>
        </div>
    </form>
</div>
</body>
</html>
